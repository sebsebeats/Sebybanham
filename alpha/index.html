<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="0;url=https://sebs-alpha-dash.vercel.app/">
  <meta name="theme-color" content="#071321">
  <title>ALPHA Dash — Seb Banham</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#071321;color:#edf4ff;padding:24px}
    main{text-align:center;max-width:540px}
    .mark{display:inline-grid;place-items:center;width:58px;height:58px;border:1px solid #5d7fa4;border-radius:17px;color:#c7def8;font-weight:800;letter-spacing:.13em}
    h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.04em;margin:22px 0 8px}
    p{color:#b4c5d9;line-height:1.6}
    a{display:inline-block;margin-top:14px;padding:13px 20px;background:#c9e5ff;color:#0b2034;text-decoration:none;font-weight:750;border-radius:11px}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
  <script>
    // GitHub Pages serves this static gateway. Authentication remains on Vercel.
    window.location.replace("https://sebs-alpha-dash.vercel.app/");
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">SB</div>
    <h1>Opening ALPHA Dash</h1>
    <p>Taking you to the private, password-protected dashboard.</p>
    <a href="https://sebs-alpha-dash.vercel.app/" rel="noreferrer">Continue to ALPHA Dash</a>
  </main>
</body>
</html>
